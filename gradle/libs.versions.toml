[versions]
# Default
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
material = "1.14.0"
# Compose Libraries
compose-bom = "2026.09.00"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
icons-extended = "1.7.8"
# Hilt
hilt-android = "2.60.1"
hilt-navigation-compose = "1.4.0"
# Ksp
ksp = "2.3.13"
# Retrofit
retrofit = "3.0.0"
gson = "3.0.0"
# Room
room = "2.8.5"
# Tests
mockk = "1.14.12"
corrutines-test = "1.11.0"
turbine = "1.2.1"
# Detekt
detekt = "1.23.8"
# CI
sonarqube = "7.5.0.8588"

[libraries]
# Default
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" }
androidx-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "icons-extended" }
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt-android" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt-android" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
# Retrofit
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "gson" }
# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Tests
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-corrutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "corrutines-test" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
# Default
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Ksp
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Hilt
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt-android" }
# Detekt
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
#CI
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
